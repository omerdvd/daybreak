name: Tests

'on':
  push:
    branches:
      - main
  pull_request:

jobs:
  php-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Run native test suite
        env:
          # No config/.env in CI (never committed, by design). CredentialVault
          # needs *some* APP_KEY to derive its AES key from — this is a
          # fixed, non-secret, CI-only value (Config::get() already falls
          # back to getenv() when .env is absent), not a real production key.
          APP_KEY: ci-test-only-app-key-not-a-real-secret
        run: php tests/run.php

  php-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP files
        run: find bin public src tests -name '*.php' -print0 | xargs -0 -n1 php -l
